name: Provision Convex and build frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize backend releases so an older deployment cannot race a newer one.
concurrency:
  group: convex-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy schema and functions, and build matching frontend
        run: npm run build:release
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # Do not publish a frontend artifact if backend provisioning failed.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
